<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category | Anu Atelier</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .category-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 5%;
        }
        
        .breadcrumbs {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            display: flex; gap: 0.5rem; align-items: center;
        }
        .breadcrumbs a {
            color: var(--primary);
            text-decoration: none;
        }
        .breadcrumbs a:hover {
            text-decoration: underline;
        }
        
        .category-header {
            margin-bottom: 3rem;
            text-align: center;
        }
        .category-header h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }
        
        .subcategory-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
        }
        .subcat-pill {
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            background: var(--white);
            border: 1px solid #eee;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .subcat-pill:hover, .subcat-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        
        .filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }
        
        .filters-group {
            display: flex; gap: 1rem; align-items: center;
        }
        
        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-family: var(--font-body);
        }
        
        .empty-state {
            text-align: center;
            padding: 5rem 0;
        }
        .empty-state i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        
        /* Product Card Updates */
        .product-card {
            display: flex;
            flex-direction: column;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .product-image {
            height: 250px;
            width: 100%;
            overflow: hidden;
            position: relative;
            background: #f8f9fa;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .product-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .product-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            flex: 1;
        }
        .product-price-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .product-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .product-original-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .view-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.8rem;
            border-radius: 50px;
            text-align: center;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .view-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .loading {
            text-align: center; padding: 5rem 0; font-size: 1.5rem; color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Anu<span>Atelier</span></a>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search for handmade magic...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="nav-icons" style="align-items: center;">
            <a href="seller.html" class="btn small-btn" style="margin-right:0.5rem; padding: 0.5rem 1rem; text-decoration:none;"><i class="fas fa-plus"></i> Add Craft</a>
            <a href="profile.html" class="icon"><i class="far fa-user"></i></a>
        </div>
    </nav>

    <div class="category-page">
        <div class="breadcrumbs" id="breadcrumbs">
            <a href="index.html">Home</a> / <span id="bc-cat">Category</span>
        </div>
        
        <div class="category-header">
            <h1 id="page-title">Category Name</h1>
            <p id="page-desc">Explore our beautiful collection.</p>
        </div>
        
        <div class="subcategory-nav" id="subcat-nav">
            <!-- Populated dynamically -->
        </div>
        
        <div class="filters-bar">
            <div class="filters-group">
                <span style="font-weight: 500; color: var(--text-muted);"><span id="product-count">0</span> Products</span>
            </div>
            <div class="filters-group">
                <select id="sort-select" class="filter-select">
                    <option value="newest">Newest Arrivals</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name-asc">Name: A-Z</option>
                </select>
            </div>
        </div>
        
        <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading crafts...</div>
        
        <div class="product-grid" id="product-grid" style="display:none;">
            <!-- Products will be injected here -->
        </div>
        
        <div class="empty-state" id="empty-state" style="display:none;">
            <i class="fas fa-box-open"></i>
            <h3>No crafts available in this category yet.</h3>
            <a href="seller.html" class="btn primary-btn" style="text-decoration:none; display:inline-block; margin-top:1rem;">Add Your First Craft</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:3000/api' : '/api';
        
        const urlParams = new URLSearchParams(window.location.search);
        let currentCat = urlParams.get('cat');
        let currentSubCat = urlParams.get('subcat');
        let searchQuery = urlParams.get('q');
        
        let allProducts = [];
        let categoriesData = {};

        async function init() {
            try {
                // Fetch config & products in parallel
                const [catRes, prodRes] = await Promise.all([
                    fetch(`${API_URL}/categories`),
                    fetch(`${API_URL}/products`)
                ]);
                
                categoriesData = await catRes.json();
                allProducts = await prodRes.json();
                
                renderPage();
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = 'Failed to load data. Please try again.';
            }
        }

        function renderPage() {
            document.getElementById('loading').style.display = 'none';
            
            let filtered = allProducts.filter(p => p.status === 'published');
            
            // Handle Search
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(q) || 
                    p.description.toLowerCase().includes(q) ||
                    p.categoryName.toLowerCase().includes(q) ||
                    p.subcategoryName.toLowerCase().includes(q)
                );
                document.getElementById('page-title').textContent = `Search Results for "${searchQuery}"`;
                document.getElementById('bc-cat').textContent = 'Search';
                document.getElementById('subcat-nav').style.display = 'none';
            } 
            // Handle Category
            else if (currentCat && categoriesData[currentCat]) {
                const catInfo = categoriesData[currentCat];
                document.getElementById('page-title').textContent = catInfo.name;
                document.getElementById('bc-cat').textContent = catInfo.name;
                
                filtered = filtered.filter(p => p.categoryId === currentCat);
                
                // Render Subcategory pills
                const subcatNav = document.getElementById('subcat-nav');
                subcatNav.innerHTML = `<a href="?cat=${currentCat}" class="subcat-pill ${!currentSubCat ? 'active' : ''}">All</a>`;
                
                catInfo.subcategories.forEach(sub => {
                    const formatted = sub.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    const isActive = currentSubCat === sub ? 'active' : '';
                    subcatNav.innerHTML += `<a href="?cat=${currentCat}&subcat=${sub}" class="subcat-pill ${isActive}">${formatted}</a>`;
                });
                
                if (currentSubCat) {
                    filtered = filtered.filter(p => p.subcategoryId === currentSubCat);
                    const formattedSub = currentSubCat.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    document.getElementById('breadcrumbs').innerHTML = `
                        <a href="index.html">Home</a> / 
                        <a href="?cat=${currentCat}">${catInfo.name}</a> / 
                        <span>${formattedSub}</span>
                    `;
                }
            } else {
                // All Crafts
                document.getElementById('page-title').textContent = 'All Crafts';
                document.getElementById('bc-cat').textContent = 'All Crafts';
                document.getElementById('subcat-nav').style.display = 'none';
            }
            
            renderProducts(filtered);
            
            // Sort Listener
            document.getElementById('sort-select').addEventListener('change', (e) => {
                const val = e.target.value;
                let sorted = [...filtered];
                if(val === 'price-low') sorted.sort((a,b) => a.price - b.price);
                if(val === 'price-high') sorted.sort((a,b) => b.price - a.price);
                if(val === 'name-asc') sorted.sort((a,b) => a.name.localeCompare(b.name));
                if(val === 'newest') sorted.sort((a,b) => b.createdAt - a.createdAt);
                
                renderProducts(sorted);
            });
            
            // Search Listener
            document.getElementById('search-btn').addEventListener('click', () => {
                const q = document.getElementById('search-input').value.trim();
                if(q) window.location.href = `category.html?q=${encodeURIComponent(q)}`;
            });
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') document.getElementById('search-btn').click();
            });
        }
        
        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            const empty = document.getElementById('empty-state');
            document.getElementById('product-count').textContent = products.length;
            
            if (products.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            grid.innerHTML = products.map(p => {
                const formattedSub = p.subcategoryName.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                const originalHtml = p.originalPrice ? `<span class="product-original-price">₹${p.originalPrice}</span>` : '';
                return `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="${p.image || 'img/placeholder.png'}" alt="${p.name}">
                        </div>
                        <div class="product-info">
                            <span class="product-category">${formattedSub}</span>
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price-row">
                                <span class="product-price">₹${p.price}</span>
                                ${originalHtml}
                            </div>
                            <a href="product.html?id=${p.id}" class="view-btn">View Details</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
